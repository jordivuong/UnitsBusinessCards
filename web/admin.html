<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administration — Cartes de visite</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <h1>Administration</h1>
    <div id="adminBar" hidden><a href="/">Générateur</a> <span id="adminWho"></span> <button class="link" id="adminLogout">Se déconnecter</button></div>
  </header>
  <main>
    <p class="error" id="fatal" role="alert"></p>

    <section id="adminLogin" class="panel" hidden>
      <h2>Connexion administrateur</h2>
      <form id="adminLoginForm">
        <label>E-mail <input type="email" name="email" autocomplete="username" required></label>
        <label>Mot de passe <input type="password" name="password" autocomplete="current-password" required></label>
        <p class="error" id="adminLoginError" role="alert"></p>
        <button class="primary">Se connecter</button>
      </form>
    </section>

    <div id="admin" hidden>
      <section class="panel">
        <h2>Nouveau client</h2>
        <p class="hint">Crée sa page <code id="originHint"></code>/<b>identifiant</b>. Ajoutez ensuite ses polices, ses modèles et ses comptes dans sa fiche.</p>
        <form id="clientForm" class="inline">
          <label>Identifiant (a-z, 0-9, tirets) <input type="text" name="slug" pattern="[a-z0-9][a-z0-9\-]{0,39}" placeholder="acme" required></label>
          <label>Nom affiché <input type="text" name="name" placeholder="ACME SA" required></label>
          <button class="primary">Créer la page du client</button>
        </form>
        <p class="error" id="clientError" role="alert"></p>
      </section>

      <h2 class="section">Clients <span class="hint" id="clientCount"></span></h2>
      <p class="notice warn" id="noToken" hidden>Le jeton Figma n'est pas configuré sur le serveur : l'import de modèles est indisponible.</p>
      <p class="error" id="globalError" role="alert"></p>
      <div id="clients"></div>
    </div>
  </main>
  <script src="/admin.js" type="module"></script>
</body>
</html>
