<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Bannière large</title>
  <meta name="banner:size" content="1200x628">
  <meta name="banner:label" content="Réseaux sociaux 1200×628">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="banner wide">
    <img class="logo" src="assets/logo.svg" alt="">
    <div class="nom" data-field="nom" data-label="Nom" data-max="40" data-fit data-min-size="32" data-sample="Jeanne Martin">Jeanne Martin</div>
    <div class="titre" data-field="titre" data-label="Fonction" data-max="60" data-fit data-min-size="18" data-sample="Directrice commerciale">Directrice commerciale</div>
    <div class="cta" data-field="cta" data-label="Texte du bouton" data-max="24" data-optional data-fit data-min-size="16" data-sample="Prenez rendez-vous">Prenez rendez-vous</div>
  </div>
</body>
</html>
