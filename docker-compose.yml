services:
  cartes:
    build: .
    restart: unless-stopped
    expose:
      - "3000"                  # non publié : seul Caddy y accède
    environment:
      COOKIE_SECURE: "1"
      FIGMA_TOKEN: "${FIGMA_TOKEN:-}"            # import Figma (page Admin) ; défini dans .env, jamais dans le dépôt
      ADMIN_EMAILS: "${ADMIN_EMAILS:-}"          # comptes autorisés sur la page Admin (séparés par des virgules)
      # ALLOW_TEST_PROFILE: "1" # essai SANS profil ICC (fichiers non imprimables)
    volumes:
      - cartes-data:/data       # comptes clients et secret de session
      - ./icc:/app/icc:ro       # profils ICC (non versionnés, voir icc/README.md)
      - ./clients:/app/clients:ro   # un dossier par client (modèles, polices) : voir docs/FIGMA.md

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [cartes]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Renseignez DOMAIN dans le fichier .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # certificats Let's Encrypt
      - caddy-config:/config

volumes:
  cartes-data:
  caddy-data:
  caddy-config:
