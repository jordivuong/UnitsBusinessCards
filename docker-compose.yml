services:
  cartes:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"   # à placer derrière un reverse proxy HTTPS (Caddy, nginx, Traefik)
    environment:
      COOKIE_SECURE: "1"        # mettre 0 uniquement pour un essai en HTTP
      # ALLOW_TEST_PROFILE: "1" # essai SANS profil ICC (fichiers non imprimables)
    volumes:
      - cartes-data:/data       # comptes clients et secret de session
      - ./icc:/app/icc:ro       # profils ICC (non versionnés, voir icc/README.md)
volumes:
  cartes-data:
